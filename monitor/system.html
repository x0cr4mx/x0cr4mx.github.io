<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K1 ▸ SYSTEM</title>
<link rel="stylesheet" href="/assets/terminal.css">
<script src="/config.js"></script>
</head>
<body>
<header class="topbar">
  <span class="brand">K1 ▸ SYSTEM</span>
  <span id="conn-dot" class="conn-dot"></span>
  <span id="conn-label" class="micro conn-label">CONN</span>
  <span class="flex-sp"></span>
  <span id="ping" class="micro">PING —</span>
  <span id="utc-clock" class="clock"></span>
  <span id="user-email" class="micro"></span>
  <a class="btn" href="/">← TERMINAL</a>
  <button id="signout" class="btn warn">SIGN OUT</button>
</header>
<main class="fill">
  <div class="toolbar" id="qchips"><span class="micro">QUEUE ▸</span></div>
  <div class="two-col">
    <div class="scroll">
      <table class="t" id="jobs">
        <thead><tr>
          <th>CREATED UTC</th><th>ID</th><th>ROLE</th><th>WL</th><th>P</th>
          <th>STATE</th><th class="num">ATT</th><th>WORKER</th><th>ERROR</th>
        </tr></thead>
        <tbody></tbody>
      </table>
      <div class="empty" id="jobs-empty">NO JOBS</div>
    </div>
    <div class="scroll">
      <div class="panel-h"><span class="panel-t">QUEUE EVENTS</span><span class="flex-sp"></span><span class="micro" id="qe-n"></span></div>
      <table class="t" id="qevents">
        <thead><tr><th class="num">SEQ</th><th>AT UTC</th><th>JOB</th><th>EVENT</th><th>WORKER</th><th>DETAILS</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="panel-h" style="border-top:1px solid var(--border)"><span class="panel-t">CONTROL FAILURES</span></div>
      <table class="t" id="cfail">
        <thead><tr><th>TIME UTC</th><th>STAGE</th><th>TARGET</th><th class="num">ATT</th><th>CODE</th><th>BLOCKED</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="panel-h" style="border-top:1px solid var(--border)"><span class="panel-t">RECORD COUNTS</span><span class="flex-sp"></span><span class="micro" id="rc-tot"></span></div>
      <table class="t" id="rcounts">
        <thead><tr><th>KIND</th><th class="num">N</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>
<script type="module" src="/assets/monitor-system.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K1 ▸ GEO</title>
<link rel="stylesheet" href="/assets/terminal.css">
<link rel="stylesheet" href="/assets/tour.css">
<script src="/config.js"></script>
</head>
<body>
<header class="topbar">
  <span class="brand">K1 ▸ GEOPOLITICAL GLOBE</span>
  <span class="sub">PAPER ONLY</span>
  <span id="conn-dot" class="conn-dot"></span>
  <span id="conn-label" class="micro conn-label">CONN</span>
  <span class="flex-sp"></span>
  <span id="utc-clock" class="clock"></span>
  <span id="user-email" class="micro"></span>
  <a class="btn" href="/">← TERMINAL</a>
  <button id="signout" class="btn warn">SIGN OUT</button>
</header>
<iframe class="geo-frame" src="/world/" title="K1 World"></iframe>
<style>
  /* flex column so the frame fills whatever the (possibly wrapped) topbar
     leaves — on narrow viewports the topbar grows past its 32px default */
  body { display: flex; flex-direction: column; }
  iframe.geo-frame { flex: 1; min-height: 0; width: 100%; border: 0; display: block; }
</style>
<script type="module" src="/assets/monitor-geo.js"></script>
<script type="module" src="/assets/tour.js"></script>
</body>
</html>
